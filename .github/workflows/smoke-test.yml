name: Artifact smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify model checksums
        run: sha256sum --check --strict SHA256SUMS

      - name: Build artifact image
        run: docker build --tag pq-edhoc-tamarin:ci .

      - name: Test verification environment
        run: |
          mkdir -p results
          docker run --rm \
            --volume "${PWD}/results:/artifact/results" \
            pq-edhoc-tamarin:ci versions
